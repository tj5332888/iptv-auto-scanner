name: Update IPTV Sources

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时
  workflow_dispatch:          # 手动触发
  push:
    branches: [ main ]
    paths:
      - 'scanner/**'
      - 'config.yaml'

permissions:
  contents: write

concurrency:
  group: iptv-update
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run scanner
        run: python scanner/main.py

      - name: Commit & Push
        run: |
          git config user.name "iptv-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "auto: update sources $(date -u +'%F %T')"
            git push
          fi
