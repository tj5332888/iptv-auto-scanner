# IPTV 自动扫描验证系统配置

# ── 验证阈值 ──
# 75 寸大屏质量标准：码率≥800kbps（避免大屏模糊）且速度≥150KB/s（避免加载慢）
validate:
  timeout: 8              # 单请求超时（秒）
  seg_bytes: 15000        # 分片最小字节数
  min_speed_kb: 150       # 最低速度 KB/s（低于淘汰）
  min_kbps: 800           # 最低码率 kbps（75寸画质线；0=不限）
  workers: 12             # 并发数（Actions 免费额度建议 ≤15）
  max_per_source: 400     # 单上游最多验证条数（防超时）
  deadline_s: 900         # 验证阶段总时限（秒）＝15分钟，到点立即汇总

# ── L4 浏览器播放验证（可选，本地推荐开启）──
browser_verify:
  enabled: true           # true = 对速度 Top N 的源做 hls.js 实播验证
  max_test: 6             # 最多验证前 N 条（每条约 25 秒）
  start_port: 9700        # CDP 端口起始
  wait: 18                # 每条播放观察时长（秒）

