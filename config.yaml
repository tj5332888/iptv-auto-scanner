# ── GitHub 加速（中国网络访问 raw.githubusercontent 被限时用）──
github_proxy: https://gh-proxy.com/
use_github_proxy: false   # Actions runner 可直连，保持 false；本地中国网络改 true

# ── 官方直播页（浏览器抓流，需 CDP；Actions 环境自动跳过）──
